<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Stylized QR corner markers -->
  <g fill="#ffffff">
    <rect x="20" y="20" width="28" height="28" rx="4"/>
    <rect x="28" y="28" width="12" height="12" rx="2" fill="#1c71d8"/>

    <rect x="80" y="20" width="28" height="28" rx="4"/>
    <rect x="88" y="28" width="12" height="12" rx="2" fill="#1c71d8"/>

    <rect x="20" y="80" width="28" height="28" rx="4"/>
    <rect x="28" y="88" width="12" height="12" rx="2" fill="#1c71d8"/>
  </g>

  <!-- Small data modules bottom-right, suggesting decoded text -->
  <g fill="#ffffff">
    <rect x="80" y="80" width="10" height="10" rx="2"/>
    <rect x="96" y="80" width="10" height="10" rx="2"/>
    <rect x="80" y="96" width="10" height="10" rx="2"/>
    <rect x="96" y="96" width="10" height="10" rx="2" fill-opacity="0.55"/>
    <rect x="60" y="88" width="14" height="6" rx="3" fill-opacity="0.85"/>
    <rect x="60" y="100" width="20" height="6" rx="3" fill-opacity="0.6"/>
  </g>
</svg>
